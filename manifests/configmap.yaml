apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: argocd-image-updater-config
    app.kubernetes.io/part-of: argocd-image-updater-controller
  name: argocd-image-updater-config
data:
  registries.conf: |
    registries:
    - name: Homelab Zot
      prefix: registry.morrisons.site
      api_url: https://registry.morrisons.site
      credentials: secret:argocd/argocd-image-updater-zot-creds#creds
  git.commit-message-template: |
    build: automatic update of {{ .AppName }}

    {{ range .AppChanges -}}
    updates image {{ .Image }} tag '{{ .OldTag }}' to '{{ .NewTag }}'
    {{ end -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: argocd-image-updater-ssh-config
    app.kubernetes.io/part-of: argocd-image-updater-controller
  name: argocd-image-updater-ssh-config
