apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: homelab-hdmi-switch
  namespace: argocd
spec:
  writeBackConfig:
    method: "argocd"
  applicationRefs:
    - namePattern: "k8s-hdmi-switch"
      images:
        - alias: "hdmi-switch-backend"
          imageName: "registry.morrisons.site/graph-hdmi-switch:v0.0.0"
          commonUpdateSettings:
            updateStrategy: "latest"
            pullSecret: "secret:argocd/argocd-image-updater-zot-creds#creds"
            # This image is built arm64-only (deployed to pi5-8), not a
            # multi-arch manifest. Image Updater defaults to querying
            # linux/amd64 and silently ignores anything else, finding "no
            # tags" for an image that's actually pushing fine — this is
            # what tells it to look for the real platform instead.
            platforms:
              - "linux/arm64"
          manifestTargets:
            helm:
              name: "backend.image.repository"
              tag: "backend.image.tag"
        - alias: "hdmi-switch-ui"
          imageName: "registry.morrisons.site/ui-hdmi-switch:v0.0.0"
          commonUpdateSettings:
            updateStrategy: "latest"
            pullSecret: "secret:argocd/argocd-image-updater-zot-creds#creds"
          manifestTargets:
            helm:
              name: "ui.image.repository"
              tag: "ui.image.tag"
