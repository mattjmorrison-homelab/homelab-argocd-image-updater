apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: argocd
spec:
  provider:
    vault:
      server: http://k8s-openbao.openbao.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: argocd-image-updater
          serviceAccountRef:
            name: argocd-image-updater-controller
